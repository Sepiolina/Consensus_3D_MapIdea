<meta name="claude:viewport-fit-sides" content="cover">
<title>Voronoi Planet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
	/* Layout: one full-bleed WebGL stage; instrument panels float over it at the edges
	   (readouts left, controls right, zoom scale bottom centre) like a mission console. */
	:root {
		color-scheme: dark;
		--space: #03050b;
		--panel: rgba(9, 15, 27, 0.78);
		--panel-solid: #0b1322;
		--line: rgba(160, 190, 230, 0.16);
		--ink: #e9eff8;
		--muted: #8d9db6;
		--sun: #f2c14e;
		--sea: #58c7dc;
		--font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
		--font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
		--font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
		--gap: 12px;
	}
	html, body { height: 100%; }
	body {
		background: var(--space); color: var(--ink); font-family: var(--font-body); font-size: 13px; line-height: 1.45;
		overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
	}
	#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
	#stage:active { cursor: grabbing; }
	#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
	.body-label { position: absolute; left: 0; top: 0; font: 500 11px var(--font-data); color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; text-shadow: 0 1px 3px #000; }
	.body-label.home, .body-label.star { color: var(--sun); }
	/* Strength plates under army tokens (strategic layer) */
	.plate { position: absolute; left: 0; top: 0; padding: 1px 7px; border-radius: 999px; background: rgba(20, 16, 12, 0.82); border: 1px solid rgba(242, 193, 78, 0.55); color: #f3e6c4; font: 600 10.5px var(--font-data); white-space: nowrap; pointer-events: none; transition: opacity 0.25s; }
	select { font: 500 12px var(--font-body); color: var(--ink); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

	.hud { position: fixed; display: flex; flex-direction: column; gap: var(--gap); pointer-events: none; max-height: calc(100% - 110px); }
	.hud > * { pointer-events: auto; }
	.hud.left { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: min(290px, calc(100vw - 32px)); }
	.hud.right { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(250px, calc(100vw - 32px)); }

	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-width: 0; }
	.panel > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
	.panel > summary::-webkit-details-marker { display: none; }
	.panel > summary:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
	.panel > summary::after { content: "+"; font: 500 14px var(--font-data); color: var(--muted); }
	.panel[open] > summary::after { content: "−"; }
	.panel-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: calc(100vh - 220px); }

	h1 { margin: 0; font: 600 16px var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
	h2 { margin: 0; font: 600 13px var(--font-display); }
	.eyebrow { font: 500 10px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
	.group { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; border-top: 1px solid var(--line); }
	.group:first-child { border-top: 0; padding-top: 0; }
	.row { display: flex; justify-content: space-between; gap: 12px; font: 400 11.5px var(--font-data); font-variant-numeric: tabular-nums; }
	.row span:first-child { color: var(--muted); flex: none; }
	.row span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
	.row.is-home span { color: var(--sun); }

	.readout { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	.chip { font: 500 11px var(--font-data); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
	.chip.mode { background: var(--sun); color: #1b1404; border-color: transparent; }

	.control { display: flex; flex-direction: column; gap: 4px; }
	.control label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
	.control output, .val { font: 500 11.5px var(--font-data); color: var(--sea); font-variant-numeric: tabular-nums; }
	input[type="range"] { width: 100%; accent-color: var(--sun); margin: 0; height: 18px; }
	.check { display: flex; align-items: center; gap: 8px; font-size: 12px; }
	.check input { accent-color: var(--sun); width: 15px; height: 15px; margin: 0; }
	.buttons { display: flex; gap: 8px; }
	button { font: 500 12px var(--font-body); color: var(--ink); background: rgba(160, 190, 230, 0.1); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; cursor: pointer; flex: 1; }
	button:hover { background: rgba(160, 190, 230, 0.2); }
	button.primary { background: var(--sun); color: #1b1404; border-color: transparent; font-weight: 600; }
	.hint { font-size: 11.5px; color: var(--muted); margin: 0; }
	kbd { font: 500 10.5px var(--font-data); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

	#zoombar {
		position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
		width: min(460px, calc(100vw - 32px)); padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 4px;
	}
	.stops { display: flex; justify-content: space-between; }
	.stops button { flex: none; background: none; border: 0; padding: 2px 4px; font: 500 10px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
	.stops button.on { color: var(--sun); }

	#cell { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(290px, calc(100vw - 32px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
	#cell header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
	#cell-close { flex: none; padding: 2px 8px; }

	#loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #0c1830 0%, var(--space) 70%); }
	#loading .box { width: min(320px, calc(100vw - 48px)); display: flex; flex-direction: column; gap: 10px; text-align: center; }
	#loading .track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
	#loading-bar { height: 100%; width: 0; background: var(--sun); transition: width 0.15s; }

	@media (max-width: 720px) {
		.hud.left { width: calc(50vw - 22px); }
		.hud.right { width: calc(50vw - 22px); }
		#cell { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
		.panel-body { max-height: calc(100vh - 260px); }
	}
	@media (prefers-reduced-motion: reduce) { #loading-bar { transition: none; } }
</style>

<canvas id="stage" aria-label="Interactive 3D view of the generated planet and its solar system"></canvas>
<div id="labels"></div>

<div class="hud left">
	<details class="panel" open>
		<summary>
			<span><h1>Voronoi Planet</h1><span class="eyebrow" id="seed">seed</span></span>
		</summary>
		<div class="panel-body">
			<div class="readout"><span class="chip mode" id="mode">Globe</span><span class="chip" id="alt">–</span><span class="chip" id="fps">–</span></div>
			<div class="group"><span class="eyebrow">Star</span><h2 id="star-name">–</h2><div id="star-rows"></div></div>
			<div class="group"><span class="eyebrow">System</span><div id="system-rows"></div></div>
			<div class="group"><span class="eyebrow">Home planet</span><h2 id="home-name">–</h2><div id="home-rows"></div></div>
			<div class="group"><span class="eyebrow">Time</span><div id="time-rows"></div></div>
		</div>
	</details>
</div>

<div class="hud right">
	<details class="panel" open>
		<summary><h2>Controls</h2></summary>
		<div class="panel-body">
			<div class="control"><label for="speed">Time speed <output id="speed-val" for="speed"></output></label><input id="speed" type="range" min="-2" max="1.7" step="0.01" value="-1.3"></div>
			<div class="control"><label for="sea">Sea level <output id="sea-val" for="sea"></output></label><input id="sea" type="range" min="-300" max="300" step="5" value="0"></div>
			<div class="control"><label for="flood">River flooding <output id="flood-val" for="flood"></output></label><input id="flood" type="range" min="0" max="1" step="0.01" value="0"></div>
			<label class="check" for="borders"><input id="borders" type="checkbox"> Cell borders</label>
			<label class="check" for="strategic"><input id="strategic" type="checkbox" checked> Strategic layer</label>
			<div class="control"><label for="lens">Map lens</label><select id="lens"><option value="0">Natural</option><option value="1">Elevation</option><option value="2">Temperature</option><option value="3">Rainfall</option><option value="4">Biome</option></select></div>
			<div class="buttons"><button id="pause" type="button">Pause</button><button id="regen" type="button" class="primary">New world</button></div>
			<p class="hint">Drag to move, scroll or pinch to zoom, right-drag or <kbd>Shift</kbd>+drag to rotate and tilt. Click a cell to inspect it. Keys: <kbd>WASD</kbd> <kbd>Q</kbd><kbd>E</kbd> <kbd>Z</kbd><kbd>X</kbd> <kbd>Space</kbd>.</p>
		</div>
	</details>
</div>

<div id="cell" class="panel" hidden>
	<header><span><span class="eyebrow" id="cell-id">cell</span><h2 id="cell-title">–</h2></span><button id="cell-close" type="button" aria-label="Close cell details">×</button></header>
	<div id="cell-rows"></div>
</div>

<div id="zoombar" class="panel">
	<div class="stops">
		<button type="button" data-alt="14" data-mode="3D map">3D map</button>
		<button type="button" data-alt="330" data-mode="Globe">Globe</button>
		<button type="button" data-alt="60000" data-mode="System">Solar system</button>
	</div>
	<input id="zoom" type="range" min="0.6" max="5.6" step="0.005" value="2.5" aria-label="Zoom from map to solar system">
</div>

<div id="loading"><div class="box"><span class="eyebrow">Voronoi Planet</span><h2 id="loading-text">Starting</h2><div class="track"><div id="loading-bar"></div></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/worldgen.js"></script>
<script src="js/solarsystem.js"></script>
<script src="js/shaders.js"></script>
<script src="js/vegetation.js"></script>
<script src="js/strategic.js"></script>
<script src="js/planetview.js"></script>
<script src="js/main.js"></script>
